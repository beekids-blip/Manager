<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bee Kids 簽到卡製作平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@900&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f3;--card:#fff;--ink:#2a2418;--mute:#7a705c;--line:#e6dfcf;--accent:#f5b800;--accent-ink:#2a2418;--warn:#b4531a;--ok:#2f7d4f;--input:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a15;--card:#26231c;--ink:#f3ecda;--mute:#a99f87;--line:#3a3629;--accent:#f5b800;--accent-ink:#1c1a15;--warn:#f0a068;--ok:#6cc58f;--input:#1c1a15;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1a15;--card:#26231c;--ink:#f3ecda;--mute:#a99f87;--line:#3a3629;--accent:#f5b800;--accent-ink:#1c1a15;--warn:#f0a068;--ok:#6cc58f;--input:#1c1a15;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
header{background:var(--accent);color:#2a2418;padding:18px 20px}
header h1{margin:0;font-size:20px}header p{margin:2px 0 0;font-size:13px;opacity:.8}
main{max-width:1000px;margin:0 auto;padding:16px;display:grid;gap:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
h2{margin:0 0 10px;font-size:16px;display:flex;gap:8px;align-items:center}
h2 b{background:var(--accent);color:#2a2418;border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center;font-size:13px}
textarea,input{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
textarea{width:100%;height:110px;font-size:12px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-top:10px}
label{display:grid;gap:3px;font-size:12px;color:var(--mute)}
label input{width:130px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;padding:10px 22px}
button:disabled{opacity:.45;cursor:not-allowed}
.msg{font-size:13px;color:var(--mute);margin-top:8px}.msg.warn{color:var(--warn)}.msg.ok{color:var(--ok)}
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:500}
tr.sel{background:color-mix(in srgb,var(--accent) 18%,transparent)}
tr.off td{opacity:.4}
td input{width:100%;min-width:60px;padding:3px 6px}td input.n{width:70px}
.note{color:var(--warn);font-size:12px}
canvas#pv{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
details summary{cursor:pointer;font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<header><h1>Bee Kids 簽到卡製作平台</h1><p>貼上新朋友資料 → 檢核 → 輸出含出血與裁切線的印刷 PDF</p></header>
<main>

 <section>
<h2><b>1</b>匯入新朋友資料</h2>
<div class="row" style="margin-top:0;margin-bottom:10px">
<label style="flex:1;min-width:240px">Google 試算表 API 網址（會自動記憶）<input id="gsurl" placeholder="https://script.google.com/macros/s/AKfycbz4pGZtoOPp8CtH7yHK8L6_LaTUWCzudvSxEjIK0D72xO5BCknTpM7gHKkF3G0T50UW/exec" style="width:100%"></label>
<button class="primary" id="gsload" style="padding:7px 16px">從試算表同步</button>
</div>
<textarea id="paste" placeholder="或者直接在試算表選取「標題列＋資料列」，複製後貼在這裡（需包含「學生姓名」欄）"></textarea>
<div class="row">
<label>上傳 CSV<input type="file" id="file" accept=".csv,.tsv,.txt" style="width:200px"></label>
<label>只處理此日期之後填表者<input id="since" placeholder="YYYY/MM/DD"></label>
<label>卡上製卡月份<input id="month" placeholder="YYYY/MM"></label>
<label>下一個編號<input id="next" type="number" min="1"></label>
</div>
<div class="msg" id="regmsg"></div>
<details style="margin-top:8px"><summary>編號紀錄（存在此瀏覽器；換電腦請匯出）</summary>
<textarea id="regjson" style="height:70px"></textarea>
<div class="row"><button id="regapply">套用紀錄</button><button id="regclear">清空紀錄</button></div></details>
</section>

<section>
<h2><b>2</b>檢核（唯一需要確認的地方）</h2>
<div class="msg" id="summary">尚無資料</div>
<div class="grid">
<div class="tw"><table><thead><tr><th>製卡</th><th>編號</th><th>姓名</th><th>卡片代碼</th><th>備註</th></tr></thead><tbody id="tb"></tbody></table></div>
<div><canvas id="pv" width="1004" height="591"></canvas><div class="msg">點選左側任一列即可預覽；姓名與編號可直接修改。</div></div>
</div>
</section>

<section>
<h2><b>3</b>輸出印刷檔</h2>
<div class="row">
<label>出血 mm<input id="bleed" type="number" step="0.5" min="0" value="3" style="width:80px"></label>
<label>裁切線<select id="marks" style="font:inherit;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--ink)"><option value="1">顯示</option><option value="0">不顯示</option></select></label>
<label>輸出方式<select id="mode" style="font:inherit;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--ink)"><option value="each">每人一個 PDF（檔名：編號_姓名）</option><option value="one">合併成一個 PDF</option></select></label>
<button class="primary" id="go" disabled>輸出 PDF</button>
</div>
<div class="msg" id="outmsg">成品 85×50mm、出血 3mm、頁面 97×62mm；裁切線從出血邊向外延伸 3mm。多人時會打包成 ZIP。</div>
</section>
</main>

const S=2, TW=1004, TH=591;
const L={qr:[80,170,340,430],nameE:[530,328,812,428],nameCX:670,nameCY:376,nameW:270,nameSize:90,

// ---------- 編號紀錄 ----------
function loadReg(){try{registry=JSON.parse(localStorage.getItem("bk_reg")||"{}")}catch(e){registry={}}}
function saveReg(){try{localStorage.setItem("bk_reg",JSON.stringify(registry))}catch(e){}$("regjson").value=JSON.stringify(registry)}
function nextSerial(){const v=Object.values(registry);return v.length?Math.max(...v)+1:"" }
function refreshReg(){const n=Object.keys(registry).length;
 $("regmsg").textContent=n?`已記錄 ${n} 人；已製卡者不會重複出現。`:"尚無編號紀錄：首次使用請填「下一個編號」與「只處理此日期之後」。";
 $("regmsg").className="msg"+(n?"":" warn");$("regjson").value=JSON.stringify(registry);if(!$("next").value)$("next").value=nextSerial()}

// ---------- 解析貼上的資料 ----------
function parseTable(t){const d=t.includes("\t")?"\t":",";const out=[];let r=[],c="",q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===d){r.push(c);c=""}
  else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);out.push(r);r=[];c=""}
  else c+=ch}
 if(c||r.length){r.push(c);out.push(r)}return out}
const dateOf=s=>{const m=/(\d{4})\/(\d{1,2})\/(\d{1,2})/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const bday=s=>{const m=/(\d{4})\/(\d{1,2})\/(\d{1,2})/.exec(s||"");return m?`${m[1]}/${m[2].padStart(2,"0")}/${m[3].padStart(2,"0")}`:(s||"").trim()};

function build(){
 let sheetRows=null;
function build(){
 const t=$("paste").value.trim();rows=[];
 if(!t&&!sheetRows){$("summary").textContent="尚無資料";draw();return}
 const tab=sheetRows||parseTable(t);
 const hi=tab.findIndex(r=>r.includes("學生姓名"));
 if(hi<0){$("summary").textContent="找不到「學生姓名」欄位，請確認標題列名稱。";$("summary").className="msg warn";draw();return}
 const h=tab[hi],ix=k=>h.indexOf(k),iN=ix("學生姓名"),iT=ix("時間戳記"),iB=ix("學生生日");
 const since=dateOf($("since").value+" ");let skipped=0,seen={};
 const month=$("month").value;let nxt=parseInt($("next").value)||0;
 for(const r of tab.slice(hi+1)){
  const name=(r[iN]||"").trim();if(!name&&!(r.join("").trim()))continue;
  const ts=dateOf(r[iT]);if(since&&(!ts||ts<since))continue;
  const key=name+"|"+bday(r[iB]);
  if(!name){rows.push({name:"",on:false,note:"姓名空白"});continue}
  if(registry[key]!=null){skipped++;continue}
  if(key in seen){rows[seen[key]].on=false;rows[seen[key]].note="重複填表，保留較新一筆"}
  seen[key]=rows.length;rows.push({name,key,on:true,note:""})}
 let n=nxt;for(const r of rows)if(r.on){r.serial=n++}
 $("summary").className="msg";$("summary").textContent=`新增 ${rows.filter(r=>r.on).length} 張（已製卡而略過 ${skipped} 人）`;
 if(!nxt&&rows.some(r=>r.on)){$("summary").className="msg warn";$("summary").textContent="請先填寫「下一個編號」"}
 sel=Math.max(0,rows.findIndex(r=>r.on));draw()}

function draw(){
 const tb=$("tb");tb.textContent="";
 rows.forEach((r,i)=>{const tr=document.createElement("tr");if(i===sel)tr.className="sel";if(!r.on)tr.classList.add("off");
  const cb=document.createElement("input");cb.type="checkbox";cb.checked=r.on;cb.onchange=()=>{r.on=cb.checked;renumber();draw()};
  const nm=document.createElement("input");nm.value=r.name;nm.oninput=()=>{r.name=nm.value;codeUpdate();preview()};
  const sn=document.createElement("input");sn.type="number";sn.className="n";sn.value=r.serial??"";sn.oninput=()=>{r.serial=parseInt(sn.value)||0;codeUpdate();preview()};
  const code=document.createElement("td");code.className="code";
  const note=document.createElement("td");note.className="note";note.textContent=(r.note||"")+(r.name.length>5?" 姓名較長，字會縮小":"");
  [cb,sn,nm].forEach(e=>{const td=document.createElement("td");td.appendChild(e);tr.appendChild(td)});tr.appendChild(code);tr.appendChild(note);
  tr.onclick=e=>{if(e.target.tagName!=="INPUT"){sel=i;draw()}};tb.appendChild(tr);r.codeEl=code});
 codeUpdate();$("go").disabled=!rows.some(r=>r.on&&r.name&&r.serial);preview()}
function codeUpdate(){const m=($("month").value||"").replace("/","");rows.forEach(r=>{if(r.codeEl)r.codeEl.textContent=r.on&&r.serial?`${m} ${String(r.serial).padStart(4,"0")}`:"-"})}
function renumber(){let n=parseInt($("next").value)||0;rows.forEach(r=>{if(r.on)r.serial=n++})}

async function renderCard(name, serial, month, bleedMm = 0, opts = {}) {
  const { drawCropMarks = true, cropLenMm = 2, cropOffsetMm = 0.5 } = opts;
  await Promise.all([
    document.fonts.load(`900 90px ${NAMEFONT}`, name || "字"),
    document.fonts.load(`700 27px ${TXTFONT}`, "0123456789/ ")
  ]).catch(() => {});

  const W = TW * S, H = TH * S;
  const c = document.createElement("canvas");
  c.width = W;
  c.height = H;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.imageSmoothingQuality = "high";
  x.drawImage(tplImg, 0, 0, W, H);

  const fill = (b, col) => {
    x.fillStyle = `rgb(${col})`;
    x.fillRect(b[0] * S, b[1] * S, (b[2] - b[0]) * S, (b[3] - b[1]) * S);
  };

  // QR
  const [qx0, qy0, qx1, qy1] = L.qr;
  x.fillStyle = "#fff";
  x.fillRect(qx0 * S, qy0 * S, (qx1 - qx0) * S, (qy1 - qy0) * S);
  const q = qrcode(0, "M");
  q.addData(String(serial), "Numeric");
  q.make();
  const n = q.getModuleCount();
  const mod = Math.floor((qx1 - qx0) * S / (n + 3));
  const ox = qx0 * S + Math.floor(((qx1 - qx0) * S - mod * n) / 2);
  const oy = qy0 * S + Math.floor(((qy1 - qy0) * S - mod * n) / 2);
  x.fillStyle = "#000";
  for (let r = 0; r < n; r++) {
    for (let k = 0; k < n; k++) {
      if (q.isDark(r, k)) x.fillRect(ox + k * mod, oy + r * mod, mod, mod);
    }
  }

  const put = (txt, font, px, ax, cy, align, stroke) => {
    x.font = `${font.w} ${px * S}px ${font.f}`;
    x.textAlign = align;
    x.textBaseline = "alphabetic";
    const m = x.measureText(txt);
    const y = cy * S + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
    x.fillStyle = "#000";
    x.fillText(txt, ax * S, y);
    if (stroke) {
      x.lineWidth = stroke * S;
      x.strokeStyle = "#000";
      x.strokeText(txt, ax * S, y);
    }
    return m.width / S;
  };

  // 姓名
  fill(L.nameE, bg);
  let px = L.nameSize;
  x.font = `900 ${px * S}px ${NAMEFONT}`;
  while (x.measureText(name).width > L.nameW * S && px > 20) {
    px -= 2;
    x.font = `900 ${px * S}px ${NAMEFONT}`;
  }
  put(name, { w: 900, f: NAMEFONT }, px, L.nameCX, L.nameCY, "center", 0);

  // 月份與編號
  fill(L.dateE, bg);
  put(month, { w: 700, f: TXTFONT }, L.dateSize, L.dateX, L.dateCY, "left", 1);
  fill(L.codeE, bar);
  const sn = String(serial).padStart(4, "0");
  const w = put(sn, { w: 700, f: TXTFONT }, L.codeSize, L.codeR, L.codeCY, "right", 1);
  put(month.replace("/", ""), { w: 700, f: TXTFONT }, L.codeSize, L.codeR - w - L.gap, L.codeCY, "right", 1);

  const mmToPx = (mm) => Math.round((mm / 25.4) * 300 * S);
  const b = Math.max(0, mmToPx(bleedMm));
  const cropLen = Math.max(6 * S, mmToPx(cropLenMm));
  const cropGap = Math.max(0, mmToPx(cropOffsetMm));

  if (b <= 0 && !drawCropMarks) return c;

  const padX = Math.max(b, drawCropMarks ? cropLen + cropGap + 2 * S : b);
  const padY = Math.max(b, drawCropMarks ? cropLen + cropGap + 2 * S : b);

  const o = document.createElement("canvas");
  o.width = W + padX * 2;
  o.height = H + padY * 2;
  const y = o.getContext("2d", { willReadFrequently: true });

  y.fillStyle = "#fff";
  y.fillRect(0, 0, o.width, o.height);

  // 繪製卡片本體
  y.drawImage(c, padX, padY);

  // 向外延伸出血（b > 0 時）
  if (b > 0) {
    const k = 3 * S;
    y.save();
    y.imageSmoothingEnabled = false;
    // 左、右、上、下
    y.drawImage(c, k, 0, 1, H, padX - b, padY, b, H);
    y.drawImage(c, W - k - 1, 0, 1, H, padX + W, padY, b, H);
    y.drawImage(c, 0, k, W, 1, padX, padY - b, W, b);
    y.drawImage(c, 0, H - k - 1, W, 1, padX, padY + H, W, b);
    // 四角
    y.drawImage(c, k, k, 1, 1, padX - b, padY - b, b, b);
    y.drawImage(c, W - k - 1, k, 1, 1, padX + W, padY - b, b, b);
    y.drawImage(c, k, H - k - 1, 1, 1, padX - b, padY + H, b, b);
    y.drawImage(c, W - k - 1, H - k - 1, 1, 1, padX + W, padY + H, b, b);
    y.restore();
  }

  // 繪製四角裁切線（位於卡片實際裁切邊緣 W x H 的四個角落外側）
  if (drawCropMarks) {
    const x0 = padX;
    const y0 = padY;
    const x1 = padX + W;
    const y1 = padY + H;
    const startOff = Math.max(b, cropGap); // 從出血外緣或裁切邊往外畫

    y.save();
    y.strokeStyle = "#000";
    y.lineWidth = Math.max(1, 0.75 * S);
    y.beginPath();

    // 左上角
    y.moveTo(x0 - startOff - cropLen, y0);
    y.lineTo(x0 - startOff, y0);
    y.moveTo(x0, y0 - startOff - cropLen);
    y.lineTo(x0, y0 - startOff);

    // 右上角
    y.moveTo(x1 + startOff, y0);
    y.lineTo(x1 + startOff + cropLen, y0);
    y.moveTo(x1, y0 - startOff - cropLen);
    y.lineTo(x1, y0 - startOff);

    // 左下角
    y.moveTo(x0 - startOff - cropLen, y1);
    y.lineTo(x0 - startOff, y1);
    y.moveTo(x0, y1 + startOff);
    y.lineTo(x0, y1 + startOff + cropLen);

    // 右下角
    y.moveTo(x1 + startOff, y1);
    y.lineTo(x1 + startOff + cropLen, y1);
    y.moveTo(x1, y1 + startOff);
    y.lineTo(x1, y1 + startOff + cropLen);

    y.stroke();
    y.restore();
  }

  return o;
}

// ---------- 輸出 PDF ----------
$("go").onclick=async()=>{
 const todo=rows.filter(r=>r.on&&r.name&&r.serial);if(!todo.length)return;
 const bl=Math.max(0,parseFloat($("bleed").value)||0),marks=$("marks").value==="1",len=3,m=marks?bl+len:bl,
  PW=85+2*m,PH=50+2*m,mode=$("mode").value,month=$("month").value,btn=$("go"),msg=$("outmsg"),
  pad=s=>String(s).padStart(4,"0"),safe=s=>s.replace(/[\\/:*?"<>|]/g,"").trim();
 btn.disabled=true;msg.className="msg";
 const addCard=async(doc,r,first)=>{if(!first)doc.addPage([PW,PH],"landscape");
  const c=await renderCard(r.name,r.serial,month,bl);
  doc.addImage(c.toDataURL("image/png"),"PNG",m-bl,m-bl,85+2*bl,50+2*bl,undefined,"FAST");
  if(marks){doc.setDrawColor(0);doc.setLineWidth(0.176);const x0=m,x1=m+85,y0=m,y1=m+50,a=bl,b=bl+len;
   for(const X of[x0,x1]){doc.line(X,y0-a,X,y0-b);doc.line(X,y1+a,X,y1+b)}
   for(const Y of[y0,y1]){doc.line(x0-a,Y,x0-b,Y);doc.line(x1+a,Y,x1+b,Y)}}};
 const newDoc=()=>new jspdf.jsPDF({unit:"mm",format:[PW,PH],orientation:"landscape",compress:true});
 try{
  let filename,data;
  if(mode==="one"){const doc=newDoc();
   for(let i=0;i<todo.length;i++){msg.textContent=`製作中 ${i+1}/${todo.length}…`;await addCard(doc,todo[i],i===0)}
   filename=`BeeKids_新朋友卡_${month.replace("/","")}_${pad(todo[0].serial)}-${pad(todo[todo.length-1].serial)}.pdf`;data=doc.output("blob")}
  else{const files=[];
   for(let i=0;i<todo.length;i++){msg.textContent=`製作中 ${i+1}/${todo.length}…`;const doc=newDoc();await addCard(doc,todo[i],true);
    files.push({name:`${pad(todo[i].serial)}_${safe(todo[i].name)}.pdf`,blob:doc.output("blob")})}
   if(files.length===1){filename=files[0].name;data=files[0].blob}
   else{const z=new JSZip();files.forEach(f=>z.file(f.name,f.blob));filename=`BeeKids_新朋友卡_${month.replace("/","")}.zip`;data=await z.generateAsync({type:"blob"})}}
  if(typeof claude!=="undefined"&&claude.use){
   const dl=await claude.use("downloads");
   if(!dl){msg.className="msg warn";msg.textContent="此環境無法下載檔案，請改用瀏覽器開啟。";btn.disabled=false;return}
   await dl.save({filename,data});
  }else{
   const url=URL.createObjectURL(data),a=document.createElement("a");
   a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  todo.forEach(r=>registry[r.key]=r.serial);saveReg();refreshReg();
  msg.className="msg ok";msg.textContent=`已輸出 ${todo.length} 張（${filename}），編號已記錄。頁面 ${PW}×${PH}mm，出血 ${bl}mm${marks?"，含裁切線":""}。`;
  $("next").value=nextSerial();$("paste").value="";build();
 }catch(e){msg.className="msg warn";msg.textContent=e&&e.code==="declined"?"已取消儲存（編號未記錄）。":"輸出失敗："+(e&&e.message||e)}
 btn.disabled=false};

// ---------- 初始化 ----------
$("gsurl").value=localStorage.getItem("bk_gsurl")||"";
$("gsurl").oninput=e=>localStorage.setItem("bk_gsurl",e.target.value.trim());
$("gsload").onclick=async()=>{
 const url=$("gsurl").value.trim();
 if(!url){$("summary").className="msg warn";$("summary").textContent="請先貼上 Google 試算表 API 網址";return}
 const btn=$("gsload");btn.disabled=true;btn.textContent="讀取中…";
 $("summary").className="msg";$("summary").textContent="正在連線讀取試算表資料…";
 try{
  const res=await fetch(url);
  const json=await res.json();
  if(json.error)throw new Error(json.error);
  sheetRows=json.rows;$("paste").value="";build();
 }catch(e){
  $("summary").className="msg warn";$("summary").textContent="讀取試算表失敗："+(e.message||e);
 }
 btn.disabled=false;btn.textContent="從試算表同步";
};

$("file").onchange=async e=>{const f=e.target.files[0];if(f){sheetRows=null;$("paste").value=await f.text();build()}};
$("paste").addEventListener("input",()=>{sheetRows=null;build()});
["since","month","next"].forEach(id=>$(id).addEventListener("input",()=>{if(id==="next")renumber();id==="next"?draw():build()}));
$("regapply").onclick=()=>{try{registry=JSON.parse($("regjson").value||"{}");saveReg();refreshReg();build()}catch(e){$("regmsg").textContent="紀錄格式錯誤"}};
$("regclear").onclick=()=>{if(confirm("確定清空所有編號紀錄？")){registry={};saveReg();$("next").value="";refreshReg();build()}};
const now=new Date(),p2=v=>String(v).padStart(2,"0");
$("month").value=`${now.getFullYear()}/${p2(now.getMonth()+1)}`;$("since").value=`${now.getFullYear()}/${p2(now.getMonth()+1)}/01`;
loadReg();refreshReg();
tplImg=new Image();tplImg.onload=()=>{sampleColors();build()};tplImg.src=TPL_SRC;
</script>
